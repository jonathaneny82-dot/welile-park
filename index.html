<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integrated Car Parking and Vehicle Service Management System (ICPVSMS)</title>
    <script>
      // Suppress harmless Vite HMR WebSocket connection warnings in sandboxed iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
            (event.reason.message && String(event.reason.message).includes('WebSocket')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('[vite]'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
